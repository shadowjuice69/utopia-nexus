name: Fix Reference Build Parser
on:
  push:
    paths:
      - scripts/fix_reference_build_parser.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/fix_reference_build_parser.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard/src/components/AIBuildManager.jsx
          git diff --cached --quiet || git commit -m 'Rewrite Reference Build military target parser'
          git push
