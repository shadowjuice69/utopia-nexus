name: Promote scraper v7.0.5
on:
  push:
    branches: [main]
jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote v7.0.5
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main || true
          cp tampermonkey/nexus-scraper-v7.0.5.user.txt tampermonkey/nexus-scraper.user.js
          git add tampermonkey/nexus-scraper.user.js
          git commit -m "Promote Nexus scraper v7.0.5 as canonical" || true
          git pull --rebase origin main || true
          git push origin HEAD:main
