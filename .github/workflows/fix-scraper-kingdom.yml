name: Fix scraper kingdom extraction

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch kingdom extraction and release version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tampermonkey/nexus-scraper.user.js')
          s = p.read_text()

          old = '''  // Kingdom name
  let kdNameMatch = text.match(/The kingdom of (.+?)[\n\r(]/i);
  let kdName = kdNameMatch ? kdNameMatch[1].trim() : "Unknown";

  // KD code from URL path /wol/game/kingdom_details/ISLAND/KD
  let kdCode = "";
  let urlMatch = location.pathname.match(/kingdom_details\/(\d+)\/(\d+)/);
  if (urlMatch) {
    kdCode = urlMatch[1] + ":" + urlMatch[2];
  }
'''

          new = '''  // Kingdom name — Utopia changes the heading markup between pages/ages,
  // so use several text patterns and never silently discard a visible name.
  let kdName = "Unknown";
  let kdNamePatterns = [
    /(?:The\s+)?kingdom\s+of\s+([^\n\r(]+?)(?:\s*\(\d+:\d+\))?\s*$/im,
    /kingdom\s+name\s*[:\-]\s*([^\n\r]+)/i,
    /kingdom\s*[:\-]\s*([^\n\r]+)/i
  ];
  for (let ptn of kdNamePatterns) {
    let m = text.match(ptn);
    if (m && m[1]) {
      let candidate = m[1].trim().replace(/\s+/g, " ");
      if (candidate && !/^details?$/i.test(candidate) && !/^kingdom$/i.test(candidate)) {
        kdName = candidate;
        break;
      }
    }
  }

  // KD code — reuse the scraper's hardened getKD() logic, then fall back to
  // URL/text patterns for kingdom-details pages.
  let kdCode = getKD();
  if (!kdCode || kdCode === MY_KD) {
    let urlMatch = location.href.match(/(?:kingdom_details|kingdom)[\/\-_](\d+)[\/\-_](\d+)/i);
    if (urlMatch) kdCode = urlMatch[1] + ":" + urlMatch[2];
  }
'''

          if old in s:
              s = s.replace(old, new, 1)
          else:
              print('Kingdom extraction block already patched or changed; continuing')

          # Release the repaired scraper as 6.8.1 so Tampermonkey recognizes it.
          s = s.replace('// @version      6.8\n', '// @version      6.8.1\n', 1)
          p.write_text(s)
          PY

      - name: Commit scraper patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/nexus-scraper.user.js
          if git diff --cached --quiet; then
            echo "No scraper changes needed"
            exit 0
          fi
          git commit -m "release scraper v6.8.1"
          git push

      # Force this workflow to run once after the release automation was fixed.
      # The step above is idempotent: if the scraper is already 6.8.1, it makes no change.
