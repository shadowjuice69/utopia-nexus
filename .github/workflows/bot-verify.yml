name: Bot Verify

on:
  push:
    paths:
      - "bot/**"
      - ".github/workflows/bot-verify.yml"
  pull_request:
    paths:
      - "bot/**"
      - ".github/workflows/bot-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci
      - run: node --test tests/*.test.js
