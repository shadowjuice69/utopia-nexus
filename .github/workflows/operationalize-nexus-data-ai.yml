name: Operationalize Nexus data and AI
on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch receiver and dashboard
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main || true
          python3 - <<'PY'
          from pathlib import Path
          p=Path('bot/services/intelReceiver.js')
          s=p.read_text()

          old='''    } else if (parsed.type === "news") {\n      for (const event of (parsed.data.events || [])) {\n        const { error } = await sb.from("news_events").insert({ kd_code: parsed.kd, province: prov, event_type: event.type || "news", event_text: event.text || event.raw || "", event_time: event.time || new Date().toISOString() });\n        if (error) logger.error(`[NEWS SAVE ERROR] ${error.message}`);\n      }'''
          new='''    } else if (parsed.type === "news") {\n      for (const event of (parsed.data.events || [])) {\n        const row = {\n          kd_code: parsed.kd,\n          source_province: prov || null,\n          event_type: event.event_type || "news",\n          event_text: event.raw || event.text || "",\n          date: event.date || null,\n          attacker_name: event.attacker_name || null,\n          attacker_kd: event.attacker_kd || null,\n          defender_name: event.defender_name || null,\n          defender_kd: event.defender_kd || null,\n          acres: Number(event.acres || 0) || null,\n          troops_lost: event.troops_lost || null,\n          troops_killed: Number(event.troops_killed || 0) || null,\n          books_looted: Number(event.books_looted || 0) || null,\n          food_stolen: Number(event.food_stolen || 0) || null,\n          gold_stolen: Number(event.gold_stolen || 0) || null,\n          runes_stolen: Number(event.runes_stolen || 0) || null,\n          troops_sent: Number(event.troops_sent || 0) || null,\n          buildings_survived: Number(event.buildings_survived || 0) || null,\n          credits_gained: Number(event.credits_gained || 0) || null,\n          peasants_settled: Number(event.peasants_settled || 0) || null,\n          return_days: event.return_days != null ? Number(event.return_days) : null,\n          return_date: event.return_date || null,\n          raw: event.raw || event.text || null,\n          created_at: event.created_at || new Date().toISOString(),\n        };\n        const { error } = await sb.from("news_events").insert(row);\n        if (error) logger.error(`[NEWS SAVE ERROR] ${error.message}`);\n      }'''
          if old not in s:
              raise SystemExit('news block not found')
          s=s.replace(old,new,1)

          marker='''        const { askOpenRouter } = require("./openrouterService");\n        const sb = supabaseService.getClient();\n        const contextLines = [];'''
          replacement='''        const { askOpenRouter } = require("./openrouterService");\n        const { getKingdomContext } = require("./aiContextService");\n        const sb = supabaseService.getClient();\n        const contextLines = [];'''
          if marker not in s:
              raise SystemExit('ai ask marker not found')
          s=s.replace(marker,replacement,1)

          old2='''        const richContext = contextLines.join("\\n");\n        const prompt = `You are Nexus, a war strategist for a Utopia kingdom. Answer concisely and tactically using real game mechanics.\\n\\nKINGDOM CONTEXT:\\n${richContext}\\n\\n${context ? "ADDITIONAL CONTEXT:\\n" + context + "\\n\\n" : ""}QUESTION: ${question}`;'''
          new2='''        const requestedKd = context.match(/(?:kingdom|kd)(?:[^0-9]*)(\\d+:\\d+)/i)?.[1] || process.env.MY_KD || "";\n        const requestedProvince = context.match(/(?:current province|province)\\s*[:=]\\s*([^\\n]+)/i)?.[1]?.trim() || "";\n        const fullContext = await getKingdomContext({ kd: requestedKd, province: requestedProvince, question });\n        const richContext = [contextLines.join("\\n"), fullContext.text].filter(Boolean).join("\\n\\n");\n        const prompt = `You are Nexus, a war strategist for a Utopia kingdom. Answer concisely and tactically using real game mechanics. Treat the supplied database context as the current source of truth. Do not invent missing values.\\n\\nKINGDOM CONTEXT:\\n${richContext}\\n\\n${context ? "ADDITIONAL CONTEXT:\\n" + context + "\\n\\n" : ""}QUESTION: ${question}`;'''
          if old2 not in s:
              raise SystemExit('ai ask prompt block not found')
          s=s.replace(old2,new2,1)

          marker2='''            const { askOpenRouter } = require("./openrouterService");\n            const analysis = await askOpenRouter(prompt);'''
          replacement2='''            const { askOpenRouter } = require("./openrouterService");\n            const { getKingdomContext } = require("./aiContextService");\n            const fullContext = await getKingdomContext({ kd: process.env.MY_KD || "", question: "war report target ranking threat assessment war summary" });\n            const analysis = await askOpenRouter(prompt + `\\n\\nFULL NEXUS DATABASE CONTEXT:\\n${fullContext.text}`);'''
          if marker2 not in s:
              raise SystemExit('ai analyze marker not found')
          s=s.replace(marker2,replacement2,1)

          p.write_text(s)

          p=Path('dashboard/src/components/AIAssistant.jsx')
          s=p.read_text()
          s=s.replace('import { supabase } from "../services/supabase";\n\nconst MY_KD = "6:9";', 'import { supabase } from "../services/supabase";\nimport { loadNexusConfig, getNexusConfig } from "../services/nexusConfig";')
          s=s.replace('''      const [provincesResult, attacksResult, hostileOpsResult, summariesResult, buildsResult] = await Promise.all([\n        supabase.from("provinces").select("name, kd_code, race, personality, acres, nw, off, def, be").eq("kd_code", MY_KD),''','''      const config = await loadNexusConfig();\n      const MY_KD = config?.kd || getNexusConfig().kd || "";\n      const [provincesResult, attacksResult, hostileOpsResult, summariesResult, buildsResult] = await Promise.all([\n        supabase.from("provinces").select("name, kd_code, race, personality, acres, nw, off, def, be").eq("kd_code", MY_KD),''')
          p.write_text(s)
          PY
          git add bot/services/intelReceiver.js dashboard/src/components/AIAssistant.jsx
          git commit -m "Route news correctly and give AI full Nexus context" || true
          git pull --rebase origin main || true
          git push origin HEAD:main
