name: Repair identity contamination

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair scraper identity ordering and unsafe fallbacks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('tampermonkey/nexus-scraper.user.js')
          s = p.read_text()

          old = '''function getProvinceName() {
  let text = document.body.innerText;
  let patterns = [
    /The Province of\\s+(.+?)\\s*\\(/i,
    /The Province of\\s+(.+)/i,
    /Province Name\\s*[:\\t]\\s*(.+)/i
  ];
  for (let p of patterns) {
    let m = text.match(p);
    if (m) return m[1].trim().replace(/\\s+/g, " ");
  }
  // SoM format: "Province Name, we have N generals available..."
  let som = text.match(/^([^,\\n]+),\\s*we have \\d+ generals? available/im);
  if (som) return som[1].trim().replace(/\\s+/g, " ");
  const own = getOwnPageIdentity();
  if (own.province) return own.province;
  return "Unknown";
}'''

          new = '''function getProvinceName() {
  const ownPages = ["throne", "council_military", "council_internal", "council_science", "council_state", "province_news", "province_logs", "kingdom_news"];
  if (ownPages.some(p => location.href.includes(p))) {
    const own = getOwnPageIdentity();
    return own.province || "Unknown";
  }

  let text = document.body.innerText;
  let patterns = [
    /The Province of\\s+(.+?)\\s*\\(/i,
    /The Province of\\s+(.+)/i,
    /Province Name\\s*[:\\t]\\s*(.+)/i
  ];
  for (let p of patterns) {
    let m = text.match(p);
    if (m) return m[1].trim().replace(/\\s+/g, " ");
  }
  let som = text.match(/^([^,\\n]+),\\s*we have \\d+ generals? available/im);
  if (som) return som[1].trim().replace(/\\s+/g, " ");
  return "Unknown";
}'''

          if old not in s:
              raise SystemExit('getProvinceName target not found')
          s = s.replace(old, new, 1)

          start = s.index('function getKD() {')
          end = s.index('\n}\n\nfunction getTab()', start) + 2
          new_getkd = '''function getKD() {
  // Own game pages are authoritative: never let URL/path/text fallbacks
  // manufacture the server owner's MY_KD for another logged-in province.
  const ownPages = ["throne", "council_military", "council_internal", "council_science", "council_state", "province_news", "province_logs", "kingdom_news"];
  if (ownPages.some(p => location.href.includes(p))) {
    const own = getOwnPageIdentity();
    return own.kd || "";
  }

  let urlParams = new URLSearchParams(location.search);
  let kdParam = urlParams.get("kd");
  if (kdParam) return kdParam;

  let dropdown = document.querySelector('select[name="kd"], select[name="kingdom"], #kd_select');
  if (dropdown && dropdown.value) return dropdown.value;

  let pathMatch = location.href.match(/\\/(\\d+)\\/(\\d+)\\//);
  if (pathMatch) return pathMatch[1] + ":" + pathMatch[2];

  let text = document.body ? document.body.innerText : "";
  let matches = [...text.matchAll(/\\b(\\d+:\\d+)\\b/g)].map(m => m[1]);
  if (matches.length === 1) return matches[0];
  return "";
}'''
          s = s[:start] + new_getkd + s[end:]

          old_fallback = '    kd: kdCode || MY_KD,'
          new_fallback = '    kd: kdCode,'
          if old_fallback not in s:
              raise SystemExit('kingdom fallback target not found')
          s = s.replace(old_fallback, new_fallback, 1)

          marker = '  // Province table — scrape rows\n  let provinces = scrapeProvinceTable();\n'
          guard = '''  // Never submit a kingdom page with an invented server-default identity.
  if (!kdCode) {
    setStatus("Kingdom code unavailable — not sending", false);
    if (callback) callback();
    return;
  }

'''
          if marker not in s:
              raise SystemExit('kingdom guard marker not found')
          s = s.replace(marker, marker + '\n' + guard, 1)

          p.write_text(s)
          print('patched scraper')
          PY

      - name: Repair backend province state scoping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('bot/services/intelReceiver.js')
          s = p.read_text()
          old = '''const { error } = await sb.from("provinces").update({ state_data: parsed.data, updated_at: new Date().toISOString() }).eq("name", prov);'''
          new = '''const { error } = await sb.from("provinces").update({ state_data: parsed.data, updated_at: new Date().toISOString() }).eq("name", prov).eq("kd_code", parsed.kd);'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          print('patched backend state scoping')
          PY

      - name: Commit repaired files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/nexus-scraper.user.js bot/services/intelReceiver.js
          if git diff --cached --quiet; then
            echo "No repair changes needed"
            exit 0
          fi
          git commit -m "fix: harden identity scoping against cross-kingdom contamination"
          git push
