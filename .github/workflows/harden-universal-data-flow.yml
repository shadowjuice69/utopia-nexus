# Triggered hardening pass for universal capture data flow.
name: Harden universal capture data flow

on:
  push:
    branches: [main]

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harden kingdom parser and receiver
        shell: python
        run: |
          from pathlib import Path
          p = Path('bot/parsers/universalCaptureParser.js')
          t = p.read_text()
          start = t.index('function parseKingdomDetails(text) {')
          end = t.index('\nfunction parseSurvey(text) {', start)
          replacement = r'''function parseKingdomDetails(text) {
  const parsed = parseKingdom(text);
  const lines = String(text || '').split(/\r?\n/).filter(Boolean);
  const provinces = [];
  const nobility = new Set([
    'Peasant', 'Squire', 'Knight', 'Lord', 'Lady', 'Baron', 'Baroness',
    'Viscount', 'Viscountess', 'Count', 'Countess', 'Marquis', 'Marchioness',
    'Duke', 'Duchess', 'Prince', 'Princess', 'King', 'Queen', 'Emperor',
    'Empress', 'Noble'
  ]);
  const parseCells = (cells) => {
    const c = cells.map(clean);
    if (c.length < 8) return null;
    const slot = number(c[0]);
    const province = clean(c[1].replace(/\s*\*+$/, '').replace(/\s*\(M\)|\s*\(S\)/gi, ''));
    const race = clean(c[2]);
    const land = number(c[3]);
    const nw = number(c[4]);
    const nwpa = number(c[5]);
    const nob = clean(c[6]);
    const gains = number(c[7]);
    if (slot == null || !province || !race || land == null || nw == null || nwpa == null || gains == null) return null;
    if (!nobility.has(nob)) return null;
    return { slot, name: province, race, land, nw, nwpa, nobility: nob, gains };
  };
  const header = lines.findIndex(line => /Slot\/Online/i.test(line));
  if (header >= 0) {
    for (let i = header + 1; i < lines.length; i++) {
      const line = lines[i];
      if (!/^\d{1,2}(?:\s|\t|$)/.test(line)) continue;
      const row = parseCells(line.split(/\t+/));
      if (row) provinces.push(row);
    }
  }
  parsed.provinces = provinces;
  parsed.province_count_parsed = provinces.length;
  parsed.raw_kind = 'kingdom_details';
  const stance = String(text || '').match(/\bStance\s*[:\t]+([^\n]+)/i);
  if (stance) parsed.stance = clean(stance[1]);
  return parsed;
}
'''
          t = t[:start] + replacement + t[end:]
          p.write_text(t)

          p = Path('bot/services/universalReceiver.js')
          t = p.read_text()
          old = '  const resolvedKd = subject.kd_code || kd || MY_KD || null;\n  const resolvedProv = subject.province || prov || MY_PROV || null;'
          new = '''  const kingdomUrlMatch = pageUrl.match(/\/wol\/game\/kingdom_details\/(\d+)\/(\d+)/i);
  const urlKd = kingdomUrlMatch ? `${kingdomUrlMatch[1]}:${kingdomUrlMatch[2]}` : null;
  const resolvedKd = urlKd || subject.kd_code || kd || MY_KD || null;
  const resolvedProv = subject.province || prov || MY_PROV || null;'''
          if old in t: t = t.replace(old, new, 1)
          t = t.replace('  if (!data || !request.kd) return;\n\n  await upsertByIdentity(\n    sb,\n    "kingdoms",\n    { kd_code: request.kd },', '  if (!data || !request.kd) return;\n  const kingdomKd = data.kd_code || request.kd;\n\n  await upsertByIdentity(\n    sb,\n    "kingdoms",\n    { kd_code: kingdomKd },', 1)
          t = t.replace('{ kd_code: request.kd, name: clean(province.name) },', '{ kd_code: kingdomKd, name: clean(province.name) },', 1)
          t = t.replace('        gains: province.gains == null ? null : String(province.gains),', '        gains: province.gains == null ? null : String(province.gains),\n        nwpa: province.nwpa == null ? null : String(province.nwpa),', 1)
          p.write_text(t)

      - name: Harden dashboard freshness and capture identity
        shell: python
        run: |
          from pathlib import Path
          p = Path('dashboard/src/components/KingdomOverview.jsx')
          t = p.read_text()
          old = '''    .eq("data_type", "kingdom")
    .eq("kd_code", kd)
    .order("received_at", { ascending: false })
    .limit(20);'''
          new = '''    .eq("data_type", "kingdom")
    .order("received_at", { ascending: false })
    .limit(100);'''
          if old in t: t = t.replace(old, new, 1)
          old = '      setKingdom(dbKingdom || (kingdomCapture ? {'
          if old in t: t = t.replace(old, '      setKingdom(kingdomCapture ? {', 1)
          old = '''        updated_at: kingdomCapture.received_at,
      } : null));'''
          if old in t: t = t.replace(old, '''        updated_at: kingdomCapture.received_at,
      } : dbKingdom));''', 1)
          p.write_text(t)

      - name: Commit hardening changes
        shell: bash
        run: |
          set -e
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot/parsers/universalCaptureParser.js bot/services/universalReceiver.js dashboard/src/components/KingdomOverview.jsx
          git commit -m 'Harden universal kingdom capture and dashboard freshness'
          git push origin HEAD:main
