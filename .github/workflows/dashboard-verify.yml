name: Dashboard Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: npm run verify
      - name: Release scraper v6.8.1
        working-directory: .
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tampermonkey/nexus-scraper.user.js')
          s = p.read_text()
          old = '// @version      6.8\n'
          new = '// @version      6.8.1\n'
          if old in s:
              p.write_text(s.replace(old, new, 1))
              print('Bumped scraper to 6.8.1')
          else:
              print('Scraper is already newer than 6.8; no version change needed')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/nexus-scraper.user.js
          if git diff --cached --quiet; then
            echo "No scraper version change needed"
            exit 0
          fi
          git commit -m "release scraper v6.8.1"
          git push
