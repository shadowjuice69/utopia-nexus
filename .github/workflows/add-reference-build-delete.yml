name: Add Reference Build Delete Action

on:
  push:
    paths:
      - '.github/workflows/add-reference-build-delete.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add delete action
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dashboard/src/components/AIBuildManager.jsx')
          s = p.read_text()
          old = ''' async function toggleActive(){if(!selectedId)return;const {data,error:e}=await supabase.from("ai_builds").update({active:!draft.active}).eq("id",selectedId).select().single();if(e)setError(e.message);else{setBuilds(items=>items.map(b=>b.id===data.id?data:b));select(data);setNotice(data.active?"Build activated for AI reference.":"Build disabled for AI reference.")}}'''
          new = ''' async function toggleActive(){if(!selectedId)return;const {data,error:e}=await supabase.from("ai_builds").update({active:!draft.active}).eq("id",selectedId).select().single();if(e)setError(e.message);else{setBuilds(items=>items.map(b=>b.id===data.id?data:b));select(data);setNotice(data.active?"Build activated for AI reference.":"Build disabled for AI reference.")}}\n async function deleteBuild(){if(!selectedId)return;const buildName=draft.name?.trim()||"this build";if(!window.confirm(`Do you want to delete "${buildName}"?`))return;setSaving(true);setError("");try{const {error:e}=await supabase.from("ai_builds").delete().eq("id",selectedId);if(e)throw e;setBuilds(items=>items.filter(b=>b.id!==selectedId));fresh();setNotice(`Deleted ${buildName}.`)}catch(e){setError(e?.message||"Could not delete the build.")}finally{setSaving(false)}}'''
          if old not in s:
              raise SystemExit('toggleActive anchor not found')
          s = s.replace(old, new, 1)
          old2 = '''<button disabled={saving} onClick={save}>{saving?"Saving...":selectedId?"💾 Update Existing Build":"💾 Save Build"}</button>{selectedId&&<button onClick={toggleActive}>{draft.active?"Disable":"Activate"}</button>}'''
          new2 = '''<button disabled={saving} onClick={save}>{saving?"Saving...":selectedId?"💾 Update Existing Build":"💾 Save Build"}</button>{selectedId&&<><button onClick={toggleActive} disabled={saving}>{draft.active?"Disable":"Activate"}</button><button onClick={deleteBuild} disabled={saving}>🗑️ Delete Build</button></>}'''
          if old2 not in s:
              raise SystemExit('button anchor not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard/src/components/AIBuildManager.jsx
          git commit -m 'Add delete action for saved reference builds'
          git push