name: Fix Intel root endpoint

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: accept Intel posts at root'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Intel receiver
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('bot/services/intelReceiver.js')
          s = p.read_text()
          old = 'if (req.method === "POST" && req.url === "/intel") {'
          new = 'if (req.method === "POST" && (req.url === "/intel" || req.url === "/")) {'
          if old not in s:
              raise SystemExit('expected Intel route was not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/services/intelReceiver.js
          git commit -m "fix: accept Intel posts at root"
          git push
