name: Identity Hotfix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply identity patch
        shell: bash
        run: |
          set -e
          echo 'PATCH_B64_PLACEHOLDER' | base64 -d > /tmp/identity_patch.py
          python3 /tmp/identity_patch.py

      - name: Commit identity patch
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tampermonkey/nexus-scraper.user.js bot/services/intelReceiver.js
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'fix: prevent cross-user province identity contamination'
          git push
