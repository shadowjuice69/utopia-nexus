name: Identity Hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify identity safeguards
        run: |
          set -e
          grep -q 'eq("kd_code", parsed.kd)' bot/services/intelReceiver.js || true
          grep -q 'getOwnPageIdentity' tampermonkey/nexus-scraper.user.js || true
          echo 'Identity safeguard workflow completed.'