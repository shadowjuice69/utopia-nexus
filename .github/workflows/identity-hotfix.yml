name: Identity Hotfix

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify cross-user identity protections
        shell: bash
        run: |
          set -e
          grep -q 'getOwnPageIdentity' tampermonkey/nexus-scraper.user.js
          grep -q 'eq("kd_code", parsed.kd)' bot/services/intelReceiver.js
          echo 'Cross-user identity protections present.'