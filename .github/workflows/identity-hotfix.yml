name: Identity Hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply identity safeguards
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tampermonkey/nexus-scraper.user.js')
          s = p.read_text()

          province = '\n'.join([
              'function getProvinceName() {',
              '  const ownPages = ["throne", "council_military", "council_internal", "council_science", "council_state", "province_news", "province_logs", "kingdom_news"];',
              '  if (ownPages.some(p => location.href.includes(p))) {',
              '    const own = getOwnPageIdentity();',
              '    return own.province || "Unknown";',
              '  }',
              '  const text = document.body ? document.body.innerText : "";',
              '  const patterns = [/The Province of\\s+(.+?)\\s*\\(/i, /The Province of\\s+(.+)/i, /Province Name\\s*[:\\t]\\s*(.+)/i];',
              '  for (const pattern of patterns) {',
              '    const m = text.match(pattern);',
              '    if (m) return m[1].trim().replace(/\\s+/g, " ");',
              '  }',
              '  const som = text.match(/^([^,\\n]+),\\s*we have \\d+ generals? available/im);',
              '  if (som) return som[1].trim().replace(/\\s+/g, " ");',
              '  return "Unknown";',
              '}'
          ])
          a = s.index('function getProvinceName() {')
          b = s.index('\n}\n\nfunction getKD()', a) + 2
          s = s[:a] + province + s[b:]

          kd = '\n'.join([
              'function getKD() {',
              '  // Own game pages are authoritative. Never fall back to MY_KD for another logged-in province.',
              '  const ownPages = ["throne", "council_military", "council_internal", "council_science", "council_state", "province_news", "province_logs", "kingdom_news"];',
              '  if (ownPages.some(p => location.href.includes(p))) {',
              '    const own = getOwnPageIdentity();',
              '    return own.kd || "";',
              '  }',
              '  const urlParams = new URLSearchParams(location.search);',
              '  const kdParam = urlParams.get("kd");',
              '  if (kdParam) return kdParam;',
              '  const dropdown = document.querySelector(\'select[name="kd"], select[name="kingdom"], #kd_select\');',
              '  if (dropdown && dropdown.value) return dropdown.value;',
              '  const pathMatch = location.href.match(/\\/(\\d+)\\/(\\d+)\\//);',
              '  if (pathMatch) return pathMatch[1] + ":" + pathMatch[2];',
              '  const text = document.body ? document.body.innerText : "";',
              '  const matches = [...text.matchAll(/\\b(\\d+:\\d+)\\b/g)].map(m => m[1]);',
              '  if (matches.length === 1) return matches[0];',
              '  return "";',
              '}'
          ])
          a = s.index('function getKD() {')
          b = s.index('\n}\n\nfunction getTab()', a) + 2
          s = s[:a] + kd + s[b:]

          s = s.replace('kd: kdCode || MY_KD,', 'kd: kdCode,')

          if 'Kingdom code unavailable — not sending' not in s:
              marker = 'let kdCode = getKD();'
              pos = s.find(marker, s.find('function scrapeKingdomPage'))
              if pos != -1:
                  insert = '\n  if (!kdCode) {\n    setStatus("Kingdom code unavailable — not sending", false);\n    return;\n  }'
                  pos2 = pos + len(marker)
                  s = s[:pos2] + insert + s[pos2:]

          p.write_text(s)
          PY

      - name: Verify
        run: |
          set -e
          grep -q 'Own game pages are authoritative' tampermonkey/nexus-scraper.user.js
          grep -q 'return "";' tampermonkey/nexus-scraper.user.js
          grep -q 'kd: kdCode,' tampermonkey/nexus-scraper.user.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/nexus-scraper.user.js
          if git diff --cached --quiet; then
            echo 'Identity safeguards already applied.'
            exit 0
          fi
          git commit -m "fix: harden scraper identity against cross-kingdom contamination"
          git push