name: Identity Hotfix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify cross-kingdom identity safeguards
        run: |
          set -e
          grep -q 'Own game pages are authoritative' tampermonkey/nexus-scraper.user.js
          grep -q 'return "";' tampermonkey/nexus-scraper.user.js
          grep -q 'kd: kdCode,' tampermonkey/nexus-scraper.user.js
          echo 'Identity safeguards verified.'