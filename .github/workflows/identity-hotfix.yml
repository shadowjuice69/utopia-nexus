name: Identity Hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply scraper identity safeguards
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('tampermonkey/nexus-scraper.user.js')
          s = p.read_text()

          province_fn = '''function getProvinceName() {
  const ownPages = ["throne", "council_military", "council_internal", "council_science", "council_state", "province_news", "province_logs", "kingdom_news"];
  if (ownPages.some(p => location.href.includes(p))) {
    const own = getOwnPageIdentity();
    return own.province || "Unknown";
  }

  const text = document.body ? document.body.innerText : "";
  const patterns = [
    /The Province of\\s+(.+?)\\s*\\(/i,
    /The Province of\\s+(.+)/i,
    /Province Name\\s*[:\\t]\\s*(.+)/i
  ];
  for (const pattern of patterns) {
    const m = text.match(pattern);
    if (m) return m[1].trim().replace(/\\s+/g, " ");
  }
  const som = text.match(/^([^,\\n]+),\\s*we have \\d+ generals? available/im);
  if (som) return som[1].trim().replace(/\\s+/g, " ");
  return "Unknown";
}'''

          s, n = re.subn(r'function getProvinceName\(\) \{.*?\n\}', province_fn, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('getProvinceName function not found')

          kd_fn = '''function getKD() {
  // Own game pages are authoritative. Never fall back to MY_KD for another logged-in province.
  const ownPages = ["throne", "council_military", "council_internal", "council_science", "council_state", "province_news", "province_logs", "kingdom_news"];
  if (ownPages.some(p => location.href.includes(p))) {
    const own = getOwnPageIdentity();
    return own.kd || "";
  }

  const urlParams = new URLSearchParams(location.search);
  const kdParam = urlParams.get("kd");
  if (kdParam) return kdParam;

  const dropdown = document.querySelector('select[name="kd"], select[name="kingdom"], #kd_select');
  if (dropdown && dropdown.value) return dropdown.value;

  const pathMatch = location.href.match(/\\/(\\d+)\\/(\\d+)\\//);
  if (pathMatch) return pathMatch[1] + ":" + pathMatch[2];

  const text = document.body ? document.body.innerText : "";
  const matches = [...text.matchAll(/\\b(\\d+:\\d+)\\b/g)].map(m => m[1]);
  if (matches.length === 1) return matches[0];
  return "";
}'''

          s, n = re.subn(r'function getKD\(\) \{.*?\n\}\n\n(?=function getTab)', kd_fn + '\n\n', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('getKD function not found')

          s, n = re.subn(r'kd:\s*kdCode\s*\|\|\s*MY_KD\s*,', 'kd: kdCode,', s, count=1)
          if n != 1:
              print('kingdom payload fallback already safe')

          if 'Kingdom code unavailable — not sending' not in s:
              s, n = re.subn(
                  r'(function scrapeKingdomPage\(\).*?let kdCode\s*=\s*getKD\(\);\n)',
                  r'\1  if (!kdCode) {\n    setStatus("Kingdom code unavailable — not sending", false);\n    return;\n  }\n',
                  s, count=1, flags=re.S)
              if n != 1:
                  print('kingdom guard insertion point not found; payload fallback remains safe')

          p.write_text(s)
          PY

      - name: Apply backend province scoping safeguard
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('bot/services/intelReceiver.js')
          s = p.read_text()
          s2 = re.sub(
              r'(sb\.from\(["\']provinces["\']\)\.update\(\{ state_data: parsed\.data, updated_at: new Date\(\)\.toISOString\(\) \}\)\.eq\(["\']name["\'], prov\))',
              r'\1.eq("kd_code", parsed.kd)',
              s,
              count=1,
          )
          if s2 != s:
              s = s2
          p.write_text(s)
          PY

      - name: Verify and commit safeguards
        shell: bash
        run: |
          set -e
          grep -q 'getOwnPageIdentity' tampermonkey/nexus-scraper.user.js
          grep -q 'Own game pages are authoritative' tampermonkey/nexus-scraper.user.js
          grep -q 'return "";' tampermonkey/nexus-scraper.user.js
          grep -q 'eq("kd_code", parsed.kd)' bot/services/intelReceiver.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/nexus-scraper.user.js bot/services/intelReceiver.js
          if git diff --cached --quiet; then
            echo 'Cross-user identity safeguards already applied.'
            exit 0
          fi
          git commit -m "fix: harden identity scoping against cross-kingdom contamination"
          git push