name: Rebuild Lint Fix
on:
  push:
    branches: [rebuild/universal-capture-v10]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[lint-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix invalid emoji character class
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dashboard/src/components/AIBuildManager.jsx')
          s = p.read_text()
          old = r"replace(/^[🎖🏗📌#>*\s]+/,\"\").trim()"
          new = r"replace(/^[#>*\s]+/,\"\").trim()"
          if old not in s:
              raise SystemExit('target lint expression not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/src/components/AIBuildManager.jsx
          git commit -m "Fix dashboard lint error [lint-fix]"
          git push
