name: Bump canonical scraper version

on:
  push:
    branches: [main]

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump scraper version
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          changed = False
          for p in [Path('tampermonkey/nexus-scraper.user.js'), Path('tampermonkey/nexus-scraper-v7.0.5.user.txt')]:
              if not p.exists():
                  continue
              s = p.read_text()
              if '// @version      7.0.5' in s:
                  p.write_text(s.replace('// @version      7.0.5', '// @version      7.0.8', 1))
                  changed = True
          if not changed:
              print('No version bump needed.')
          PY
      - name: Commit version bump
        run: |
          set -e
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tampermonkey/nexus-scraper.user.js tampermonkey/nexus-scraper-v7.0.5.user.txt
          git commit -m 'Bump scraper to v7.0.8'
          git push origin HEAD:main
