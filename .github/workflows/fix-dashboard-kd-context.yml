name: Normalize dashboard kingdom context

on:
  push:
    branches: [main]

jobs:
  patch:
    if: github.event.head_commit.message != 'Normalize dashboard kingdom context'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch hardcoded kingdom filters
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # NewsPanel: replace hardcoded kingdom with current Nexus config.
          p = Path('dashboard/src/components/NewsPanel.jsx')
          s = p.read_text()
          s = s.replace('import { supabase } from "../services/supabase";\n\nconst MY_KD = "6:9";', 'import { supabase } from "../services/supabase";\nimport { loadNexusConfig, getNexusConfig } from "../services/nexusConfig";\n\nlet MY_KD = "";')
          s = s.replace('  async function fetchAll() {\n    const [{ data: i7 }, { data: news }] = await Promise.all([', '  async function fetchAll() {\n    const config = await loadNexusConfig();\n    MY_KD = config?.kd || getNexusConfig().kd || "";\n    const [{ data: i7 }, { data: news }] = await Promise.all([')
          p.write_text(s)

          # AttackLog: replace hardcoded kingdom with current Nexus config.
          p = Path('dashboard/src/components/AttackLog.jsx')
          s = p.read_text()
          s = s.replace('import { supabase } from "../services/supabase";', 'import { supabase } from "../services/supabase";\nimport { loadNexusConfig, getNexusConfig } from "../services/nexusConfig";', 1)
          s = s.replace('  const MY_KD = "6:9";', '  const [myKd, setMyKd] = useState("");')
          s = s.replace('    async function fetch() {\n      const { data } = await supabase', '    async function fetch() {\n      const config = await loadNexusConfig();\n      const currentKd = config?.kd || getNexusConfig().kd || "";\n      setMyKd(currentKd);\n      const { data } = await supabase', 1)
          s = s.replace('a.attacker_kingdom === MY_KD', 'a.attacker_kingdom === myKd')
          s = s.replace('a.target_kingdom === MY_KD && a.attacker_kingdom !== MY_KD', 'a.target_kingdom === myKd && a.attacker_kingdom !== myKd')
          p.write_text(s)
          PY
      - name: Commit dashboard context patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dashboard/src/components/NewsPanel.jsx dashboard/src/components/AttackLog.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Normalize dashboard kingdom context"
          git push
