name: Fix intel receiver routing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-intel-receiver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply receiver patch
        run: python3 scripts/patch_intel_receiver.py
      - name: Commit receiver patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/services/intelReceiver.js
          if git diff --cached --quiet; then
            echo "No receiver changes needed"
            exit 0
          fi
          git commit -m "Fix intel receiver routing and archive all page payloads"
          git push
