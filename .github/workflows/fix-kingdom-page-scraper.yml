name: Fix kingdom and military intel parsers

on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch kingdom scraper
        shell: bash
        run: |
          set -e
          for f in tampermonkey/nexus-scraper.user.js tampermonkey/nexus-scraper-v7.0.5.user.txt; do
            [ -f "$f" ] || continue
            python3 -c 'from pathlib import Path; import re; p=Path("'$f'"); t=p.read_text(); t2=re.sub(r"text\.match\(/The\(\?:\\\\s\+Emerging\)\?\\\\s\+kingdom of\\\\s\+\(\.\+\?\)\\\[\\\\n\\\\r\(\]/i\)", r"text.match(/The\\s+(?:[A-Za-z]+\\s+)*kingdom of\\s+(.+?)[\\n\\r(]/i)", t); p.write_text(t2)'
            sed -i 's#let tables = rosterTable ? \[rosterTable\] : \[\];#let tables = rosterTable ? [rosterTable, ...Array.from(document.querySelectorAll("table")).filter(t => t !== rosterTable)] : Array.from(document.querySelectorAll("table"));#' "$f"
          done
      - name: Patch military receiver
        shell: bash
        run: |
          set -e
          python3 -c 'from pathlib import Path; p=Path("bot/services/intelReceiver.js"); t=p.read_text(); old="    result.data = { offense, defense, generals, troops, armies };"; new="    if (offense == null || defense == null || generals == null || Object.keys(troops).length === 0) {\n      const rawLines = text.split(/\\r?\\n/).map(s => s.trim()).filter(Boolean);\n      for (const line of rawLines) {\n        let m = line.match(/^(?:Net\\s+)?Offensive(?:\\s+Points)?(?:\\s+at\\s+Home)?\\s*[:\\t]+([\\d,]+)/i);\n        if (m && offense == null) offense = parseInt(m[1].replace(/,/g, \"\"), 10);\n        m = line.match(/^(?:Net\\s+)?Defensive(?:\\s+Points)?(?:\\s+at\\s+Home)?\\s*[:\\t]+([\\d,]+)/i);\n        if (m && defense == null) defense = parseInt(m[1].replace(/,/g, \"\"), 10);\n        m = line.match(/^Generals(?:\\s+available)?\\s*[:\\t]+(\\d+)/i);\n        if (m && generals == null) generals = parseInt(m[1], 10);\n      }\n      const parsedArmies = parseArmies(text);\n      if (parsedArmies.length > 0) armies.push(...parsedArmies);\n    }\n    result.data = { offense, defense, generals, troops, armies, raw: text };"; assert old in t; p.write_text(t.replace(old,new))'
      - name: Patch Intel province attribution
        shell: bash
        run: |
          set -e
          python3 -c 'from pathlib import Path; p=Path("bot/services/intelReceiver.js"); t=p.read_text(); marker="async function saveRawPageIntel(sb, parsed, prov) {"; helper="function normalizeProvinceCandidate(value) { const s=String(value||\"\").trim(); if (!s || s.length>80 || /^(unknown|intel-site|null|undefined)$/i.test(s) || /^(January|February|March|April|May|June|July|August|September|October|November|December)\\s+\\d{1,2}\\s+of\\s+YR\\d+/i.test(s) || /\\b(?:Early indications|Our thieves listen|Query completed|confidence in the information retrieved)\\b/i.test(s)) return null; return s; }"; t=(t if "function normalizeProvinceCandidate(value)" in t else t.replace(marker,helper+"\\n"+marker,1)); t=t.replace("      province: prov || parsed.prov || null,","      province: prov || null,",1); old="async function saveIntel(parsed, prov) {\\n  const sb = supabaseService.getClient();\\n  if (!sb) return;\\n  await saveRawPageIntel(sb, parsed, prov);"; new="async function saveIntel(parsed, prov) {\\n  const sb = supabaseService.getClient();\\n  if (!sb) return;\\n  prov = normalizeProvinceCandidate(prov || parsed.prov);\\n  await saveRawPageIntel(sb, parsed, prov);"; assert old in t; p.write_text(t.replace(old,new,1))'
      - name: Patch cross-user identity
        shell: bash
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('tampermonkey/nexus-scraper.user.js')
          t = p.read_text()
          changed = False

          if 'function getOwnPageIdentity()' not in t:
              anchor = 'function getProvinceName() {'
              helper = '''function getOwnPageIdentity() {
            const text = document.body ? document.body.innerText : "";
            const exact = text.match(/The Province of\s+(.+?)\s*\((\d+:\d+)\)/i);
            if (exact) return { province: exact[1].trim(), kd: exact[2] };
            const coord = text.match(/(?:Coordinates?|Kingdom|Location)\s*[:\t]+(\d+:\d+)/i);
            const name = text.match(/(?:Province Name|Your Province|Province)\s*[:\t]+([^\n\r]+)/i);
            return { province: name ? name[1].trim() : "", kd: coord ? coord[1] : "" };
          }

          '''
              if anchor not in t:
                  raise SystemExit('scraper identity anchor not found')
              t = t.replace(anchor, helper + anchor, 1)
              changed = True

          old = '  if (getKD() === MY_KD) return MY_PROVINCE;\n  return "Unknown";'
          new = '  const own = getOwnPageIdentity();\n  if (own.province) return own.province;\n  return "Unknown";'
          if old in t:
              t = t.replace(old, new, 1)
              changed = True

          old = '''  // 4. On own game pages always return MY_KD
  let ownPages = ["throne", "council_military", "council_internal", "council_science", "council_state", "province_news", "province_logs", "kingdom_news"];
  if (ownPages.some(p => location.href.includes(p))) return MY_KD;'''
          new = '''  // 4. On own game pages derive the actual logged-in province/kingdom identity.
  let ownPages = ["throne", "council_military", "council_internal", "council_science", "council_state", "province_news", "province_logs", "kingdom_news"];
  if (ownPages.some(p => location.href.includes(p))) {
    const own = getOwnPageIdentity();
    if (own.kd) return own.kd;
    return "";
  }'''
          if old in t:
              t = t.replace(old, new, 1)
              changed = True

          if changed:
              p.write_text(t)

          p = Path('bot/services/intelReceiver.js')
          t = p.read_text()
          changed = False
          marker = 'async function saveIntel(parsed, prov) {\n  const sb = supabaseService.getClient();'
          if 'Throne pages contain the authoritative province name' not in t:
              helper = '''async function saveIntel(parsed, prov) {
  const sb = supabaseService.getClient();
  // Throne pages contain the authoritative province name + coordinates.
  if (parsed.type === "throne" && parsed.data) {
    if (parsed.data.name) prov = parsed.data.name;
    if (parsed.data.coordinates) parsed.kd = parsed.data.coordinates;
  }'''
              if marker not in t:
                  raise SystemExit('receiver identity anchor not found')
              t = t.replace(marker, helper, 1)
              changed = True

          pattern = re.compile(r'''      const myKd = process\.env\.MY_KD;\n      if \(parsed\.kd === myKd\) \{.*?\n      \}\n''', re.S)
          if pattern.search(t):
              replacement = '''      const myKd = process.env.MY_KD;
      if (parsed.kd === myKd && prov) {
        const d = parsed.data;
        const provUpdate = {};
        if (d.land) provUpdate.acres = d.land;
        if (d.networth) provUpdate.nw = d.networth;
        if (d.offense) provUpdate.off = d.offense;
        if (d.defense) provUpdate.def = d.defense;
        if (d.be) provUpdate.be = d.be;
        if (d.race) provUpdate.race = d.race;
        if (d.peasants) provUpdate.peons = d.peasants;
        if (d.thieves) provUpdate.thieves = Number(d.thieves) || 0;
        if (d.wizards) provUpdate.wizards = Number(d.wizards) || 0;
        if (d.spells) provUpdate.good_spells = d.spells;
        if (parsed.kd) provUpdate.kd_code = parsed.kd;
        provUpdate.updated_at = new Date().toISOString();
        const { error: provErr } = await sb.from("provinces")
          .update(provUpdate)
          .eq("name", prov)
          .eq("kd_code", parsed.kd);
        if (provErr) logger.error(`[PROVINCE UPDATE ERROR] ${provErr.message}`);
      }
'''
              t = pattern.sub(replacement, t, count=1)
              changed = True

          if changed:
              p.write_text(t)
          PY
      - name: Commit patch
        shell: bash
        run: |
          set -e
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tampermonkey/nexus-scraper.user.js tampermonkey/nexus-scraper-v7.0.5.user.txt bot/services/intelReceiver.js
          git commit -m 'Harden Intel province attribution and identity'
          git push origin HEAD:main
