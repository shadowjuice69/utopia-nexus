server:
  port: ${PORT:10000}
  address: 0.0.0.0
  http2:
    enabled: false

lavalink:
  server:
    password: ${LAVALINK_PASSWORD}
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
  plugins:
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.7.0"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false

plugins:
  lavasrc:
    sources:
      spotify: false
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
      youtube: false
      vkmusic: false
      tidal: false
      qobuz: false
      ytdlp: true
      jiosaavn: false
    ytdlp:
      path: "yt-dlp"
      searchLimit: 10
      mixPlaylistLoadLimit: 25
      playlistLoadLimit: 1000
      customLoadArgs: ["-q", "--no-warnings", "--flat-playlist", "--skip-download", "-J"]
      customPlaybackArgs: ["-q", "--no-warnings", "-f", "bestaudio", "-J"]

logging:
  level:
    root: INFO
    lavalink: INFO
    com.github.topi314.lavasrc.ytdlp: INFO
